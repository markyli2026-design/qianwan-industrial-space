name: Code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JavaScript and map style
        run: |
          find public scripts server tests -type f \( -name '*.js' -o -name '*.mjs' \) -not -path 'public/vendor/*' -print0 | xargs -0 -n 1 node --check
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('public/basemap-light.json','utf8')); if(s.version!==8 || !s.sources.osm || !s.layers.length) process.exit(1)"
